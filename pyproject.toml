[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobappagent"
version = "0.1.0"
description = "Remote job discovery, verification, matching, and alerts"
requires-python = ">=3.11"
dependencies = ["slack-bolt>=1.20,<2"]

[tool.setuptools.packages.find]
include = ["jobapp*"]
